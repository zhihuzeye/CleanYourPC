name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package Windows x64 Binary
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Extract Version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Publish Windows x64 Single File
        run: >
          dotnet publish src/CleanYourPC.App/CleanYourPC.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./output/CleanYourPC

      - name: Copy Rules & Documentation
        shell: pwsh
        run: |
          Copy-Item -Path "rules" -Destination "./output/CleanYourPC/rules" -Recurse -Force
          Copy-Item -Path "LICENSE" -Destination "./output/CleanYourPC/LICENSE" -Force
          Copy-Item -Path "README.md" -Destination "./output/CleanYourPC/README.md" -Force

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "./output/CleanYourPC/*" -DestinationPath "CleanYourPC-win-x64.zip" -Force

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: CleanYourPC-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          name: CleanYourPC ${{ steps.get_version.outputs.VERSION }}
